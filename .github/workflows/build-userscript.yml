name: Build Pixiv userscript
on:
  push:
    paths:
      - ".github/workflows/build-userscript.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct userscript
        shell: bash
        run: |
          cat .build-parts/part-* | base64 -d | gzip -d > pixiv-smart-rank.user.js
          node --check pixiv-smart-rank.user.js
      - name: Commit final userscript
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pixiv-smart-rank.user.js
          git commit -m "feat: add Pixiv Smart Rank userscript v2.0.0"
          git push
